services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: azura_app

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - azura_node_modules:/app/node_modules
      - azura_next:/app/.next

    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"

    env_file:
      - .env

    depends_on:
      mysql:
        condition: service_healthy

    # Named node_modules volume can go stale after package.json changes (e.g. @aws-sdk).
    # Sync deps when the AWS SDK package is missing, then migrate + start.
    command:
      [
        "sh",
        "-c",
        "if [ ! -d node_modules/@aws-sdk/client-s3 ]; then npm ci; fi; npm run db:migrate:deploy && npm run dev",
      ]

    restart: unless-stopped

  mysql:
    image: mysql:8.4

    container_name: azura_mysql

    # Match macOS MySQL defaults so Prisma migrations (mixed table casing) apply on Linux.
    command:
      - --lower-case-table-names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-storage-engine=InnoDB

    environment:
      MYSQL_DATABASE: azura_db
      MYSQL_USER: azura
      MYSQL_PASSWORD: azura151993
      MYSQL_ROOT_PASSWORD: azura151993

    ports:
      - "3307:3306"

    volumes:
      - azura_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-pazura151993"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  # Database GUI: use Prisma Studio (`npm run db:studio` / `bun run db:studio`)
  # or TablePlus/Beekeeper against localhost:3307 — phpMyAdmin removed.

volumes:
  azura_mysql_data:
  azura_node_modules:
  azura_next:
