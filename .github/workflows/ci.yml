name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, tests, profiles, build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI
        run: npm run ci
        env:
          # Selected profile for generate/assert inside build:hostinger → prebuild.
          # profiles:verify runs earlier in `ci` and restores enterprise afterward;
          # build:hostinger/prebuild regenerates the selected profile for this job.
          AZURA_PROFILE: enterprise
